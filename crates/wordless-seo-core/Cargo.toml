[package]
name = "wordless-seo-core"
version = "0.1.0"
edition = "2021"
description = "WORDLESS v2 SEO core (2026-11-20 SEO split): the SEO primitives that stay linked by the main Worker — page-head rendering (title/meta/canonical/robots/OG/Twitter/JSON-LD), per-post SEO fields, site base URL, public 404 logging — shared by the main, school and SEO Workers. Everything else SEO (sitemaps, robots.txt serving, llms.txt, redirects CRUD, analysis, studio, CWV budgets, audit runs, import) lives in wordless-seo and runs in the standalone wordless-seo-worker. Pure logic over wordless-db — no Worker types, cargo-testable on native targets."

[dependencies]
wordless-kernel = { path = "../wordless-kernel" }
wordless-db = { path = "../wordless-db" }
wordless-cms = { path = "../wordless-cms" }
wordless-multisite = { path = "../wordless-multisite" }
wordless-media = { path = "../wordless-media" }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
futures-executor = "0.3"
rusqlite = { version = "0.32.1", features = ["bundled"] }
wasm-bindgen-test = { workspace = true }

[lints]
workspace = true
