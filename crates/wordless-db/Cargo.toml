[package]
name = "wordless-db"
version = "0.1.0"
edition = "2021"
description = "WORDLESS v2 D1 adapter: the Db interface (prepare/bind/all/first/run/batch, mirroring v1 src/db.ts), row-mapping helpers, and the options reader. The only crate besides wordless-kernel that touches the JS environment."

[dependencies]
wordless-kernel = { path = "../wordless-kernel" }
serde = { workspace = true }
serde_json = { workspace = true }
serde-wasm-bindgen = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
worker = { workspace = true }
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }


[dev-dependencies]
futures-executor = "0.3"

[lints]
workspace = true
