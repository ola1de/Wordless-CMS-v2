[package]
name = "wordless-school-worker"
version = "0.1.0"
edition = "2021"
description = "WORDLESS v2 school Worker (size remedy, 2026-11-20): the school portal + CBT (courses, lessons, enrolment, question bank, timed exams with server-side timing, auto-grading, results, leaderboard, certificates, public school pages) as a standalone Worker with its own 3 MiB free-tier budget. The main Worker proxies /api/school/* and the public /school pages here; this Worker owns the wl_* school tables in the SAME shared D1 database (the main Worker still runs the migrations). Internal service — reachability is the access control; auth is enforced by the router from the session cookie, exactly like the main Worker. The cron sweep that closes expired exam attempts also lives here (its own 5-minute trigger), since the main Worker no longer links wordless-school."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wordless-kernel = { path = "../wordless-kernel" }
wordless-db = { path = "../wordless-db" }
wordless-auth = { path = "../wordless-auth" }
wordless-school = { path = "../wordless-school" }
wordless-cms = { path = "../wordless-cms" }
wordless-render = { path = "../wordless-render" }
wordless-seo-core = { path = "../wordless-seo-core" }
wordless-multisite = { path = "../wordless-multisite" }
serde = { workspace = true }
serde_json = { workspace = true }
worker = { workspace = true }
wasm-bindgen = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
futures-executor = "0.3"

[lints]
workspace = true
