[package]
name = "wordless-social"
version = "0.1.0"
edition = "2021"
description = "WORDLESS v2 Social module (P7): BuddyPress-like networking — member profiles, friends (mutual, request/accept — Q11 decided 2026-11-20, follows NOT built), activity feed, groups, direct messaging, notifications, member directory. Privacy and moderation are first-class: blocked users cannot see or message each other, private groups enforce membership, visibility rules are pure functions with a test per rule."

[dependencies]
wordless-kernel = { path = "../wordless-kernel" }
wordless-db = { path = "../wordless-db" }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
futures-executor = "0.3"
rusqlite = { version = "0.32.1", features = ["bundled"] }
wasm-bindgen-test = { workspace = true }

[lints]
workspace = true
