[package]
name = "wordless-importer"
version = "0.1.0"
edition = "2021"
description = "WORDLESS v2 WordPress importer (P3): WXR import (hand-rolled streaming XML reader — quick-xml is unavailable offline), mysqldump parser, and safe PHP unserialize (objects rejected, never eval). Port of src/modules/importer/ in the v1.1.0 TypeScript repo."

[dependencies]
wordless-kernel = { path = "../wordless-kernel" }
wordless-db = { path = "../wordless-db" }
wordless-auth = { path = "../wordless-auth" }
wordless-cms = { path = "../wordless-cms" }
wordless-multisite = { path = "../wordless-multisite" }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
futures-executor = "0.3"
rusqlite = { version = "0.32.1", features = ["bundled"] }
wasm-bindgen-test = { workspace = true }

[lints]
workspace = true
