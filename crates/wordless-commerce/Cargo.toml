[package]
name = "wordless-commerce"
version = "0.1.0"
edition = "2021"
description = "WORDLESS v2 P3 commerce: integer minor-unit money (NGN default), products (stock incl. unlimited), server-side cart, orders with exactly-once paid transition and stock apply/restore, HMAC-verified payment webhooks (Paystack SHA512, Flutterwave verif-hash, Stripe SHA256 + 300 s tolerance, mock SHA256), checkout that 503s when no provider is configured, and shop page data helpers. Pure logic over wordless-db — no Worker types, cargo-testable on native targets."

[dependencies]
wordless-kernel = { path = "../wordless-kernel" }
wordless-db = { path = "../wordless-db" }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
unicode-normalization = "0.1"

[dev-dependencies]
futures-executor = "0.3"
rusqlite = { version = "0.32.1", features = ["bundled"] }
wasm-bindgen-test = { workspace = true }

[lints]
workspace = true
