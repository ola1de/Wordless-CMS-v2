[package]
name = "wordless-multisite"
version = "0.1.0"
edition = "2021"
description = "WORDLESS v2 Multisite (P12): one install running many sites — site registry, site resolution (path-based by default, subdomain as an option), per-site options, and the site-id scoping contract the core CMS queries honour. Pure logic over wordless-db — no Worker types, cargo-testable on native targets."

[dependencies]
wordless-kernel = { path = "../wordless-kernel" }
wordless-db = { path = "../wordless-db" }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
futures-executor = "0.3"
rusqlite = { version = "0.32.1", features = ["bundled"] }
wasm-bindgen-test = { workspace = true }

[lints]
workspace = true
