[package]
name = "wordless-webhooks"
version = "0.1.0"
edition = "2021"
description = "WORDLESS v2 outbound webhooks (P3, NEW — no v1 equivalent): event subscriptions, HMAC-signed deliveries, retry with backoff, delivery log. HTTP goes through a caller-supplied HttpPost trait so tests use a fake and the worker uses worker::Fetch."

[dependencies]
wordless-kernel = { path = "../wordless-kernel" }
wordless-db = { path = "../wordless-db" }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
getrandom = { workspace = true }

[dev-dependencies]
futures-executor = "0.3"
rusqlite = { version = "0.32.1", features = ["bundled"] }
wasm-bindgen-test = { workspace = true }

[lints]
workspace = true
